# Netlify build. Nitro's netlify preset writes the static site to dist/ and the
# SSR handler to .netlify/functions-internal/server — Netlify picks both up.
#
# Do not run db:migrate during this step. A bad DATABASE_URL would fail the
# whole deploy. Apply migrations from the Supabase SQL editor or locally.

[build]
  command = "npx vite build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  NODE_OPTIONS = "--max-old-space-size=4096"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
